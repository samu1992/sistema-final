services:
  nginx:
    image: nginx:alpine
    container_name: sf-nginx
    ports:
      - "8080:80"   # SOLO NGINX expuesto al host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - red-privada

  backend:
    build: ./backend
    container_name: sf-backend
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - red-privada

  redis:
    image: redis:alpine
    container_name: sf-redis
    # NO ports acá -> no se expone al host
    volumes:
      - redis-data:/data
    networks:
      - red-privada

networks:
  red-privada:
    driver: bridge

volumes:
  redis-data:
