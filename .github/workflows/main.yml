name: CI/CD a Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Login en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir Imagen (para escaneo)
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:latest ./backend

    - name: Escaneo de Seguridad con Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ secrets.DOCKER_USERNAME }}/backend:latest'
        format: 'table'
        exit-code: '1' # Frena el camión si hay rojos (High/Critical)
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'

    - name: Subir Imagen a Docker Hub
      uses: docker/build-push-action@v5
      with:
        context: ./backend # Apuntamos a tu carpeta backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/backend:latest
