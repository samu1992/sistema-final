apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-bot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crypto-bot
  template:
    metadata:
      labels:
        app: crypto-bot
    spec:
      containers:
      - name: python-app
        # LA IMAGEN REAL DE TU BOT EN ECR:
        image: 120415017560.dkr.ecr.us-east-2.amazonaws.com/sistema-final-backend:latest
        ports:
        - containerPort: 8000
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "250m"
